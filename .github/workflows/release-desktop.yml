# Builds the macOS PicG.app (.dmg) and the Windows installer (NSIS .exe)
# and publishes them + their auto-update manifests (latest-mac.yml and
# latest.yml) to a GitHub Release.
#
# Two ways to cut a release:
#
#   1. Push a tag like `v0.2.0` by hand → builds + publishes that tag.
#   2. Run this workflow manually with `bump` = patch/minor/major. The
#      `tag` job auto-increments package.json (npm version) from the
#      CURRENT version, commits "chore(release): vX", pushes the new
#      tag, and the `build-mac` job then builds + publishes it — all in
#      one run. (A tag pushed by GITHUB_TOKEN can't re-trigger another
#      workflow, so we deliberately keep both steps in this one run
#      rather than relying on the tag-push trigger above.)
#
# Running manually with `bump` = none just produces a .dmg artifact
# without publishing or tagging — handy for verifying CI changes.
#
# We key off tags rather than every push to main so dev branches don't
# burn macOS runner minutes (those are 10x billed compared to ubuntu).
#
# macOS signing + notarization are driven entirely by repo secrets — see
# docs/desktop-development.md §8.2 for how to produce each one:
#
#   MAC_CERT_P12_BASE64      Developer ID Application cert + private key,
#                            exported as .p12 and base64-encoded
#   MAC_CERT_PASSWORD        the .p12 export password
#   APPLE_API_KEY_P8_BASE64  App Store Connect API key (.p8), base64-encoded
#   APPLE_API_KEY_ID         the key's 10-char Key ID
#   APPLE_API_ISSUER         the issuer UUID from App Store Connect
#
# With none of them set (forks, or before you had a cert) the build still
# succeeds — electron-builder ships an unsigned, un-notarized DMG. Windows
# signing is separate and still unconfigured; an Apple cert does nothing
# for it.

name: Release desktop build

on:
  push:
    tags:
      - "v*"
  # Manual run. Pick a `bump` to cut a new auto-incremented tag and
  # publish; leave it `none` to just build an artifact for testing.
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (cuts a tag + publishes). 'none' = build artifact only."
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write # needed to push the release commit/tag and upload to the Release

jobs:
  # Auto-increment the version and cut a tag. Only runs on a manual
  # dispatch that asked for a bump; skipped for tag pushes and for
  # plain (bump=none) dispatches.
  tag:
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version + cut tag
        id: bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # npm version bumps package.json + package-lock.json from the
          # current version, commits, and creates an annotated v<x> tag.
          # It prints the new "vX.Y.Z" to stdout.
          new_tag=$(npm version "${{ inputs.bump }}" -m "chore(release): %s")
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "Cut $new_tag"
          # --follow-tags pushes the bump commit AND the new tag together.
          git push origin "HEAD:${{ github.ref_name }}" --follow-tags

  build-mac:
    needs: [tag]
    # Runs for tag pushes and every manual dispatch. always() lets it
    # proceed even when `tag` was skipped (tag push / bump=none). A
    # failed or cancelled `tag` job aborts the build instead.
    if: |
      always() &&
      needs.tag.result != 'failure' &&
      needs.tag.result != 'cancelled'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # When the tag job cut a new tag, build THAT commit (it carries
          # the bumped package.json). Otherwise build whatever triggered
          # us — an empty string falls through to github.ref.
          ref: ${{ needs.tag.outputs.tag || github.ref }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build Electron main + Next standalone
        run: |
          npm run electron:build
          npm run next:build:packaging

      - name: Generate icon
        run: node scripts/build-icon.js

      # @electron/notarize wants the App Store Connect key as a file on disk,
      # not as key material in an env var, so the secret has to be unpacked
      # before electron-builder runs. Exporting APPLE_API_* only when the
      # secret exists is deliberate: electron-builder throws if one of the
      # three is set and the others aren't, but skips notarization silently
      # when all three are absent. That's what keeps fork builds green.
      - name: Stage notarization API key
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "APPLE_API_KEY_P8_BASE64 not set — DMG will not be notarized."
            exit 0
          fi
          key_path="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$KEY_B64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          {
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$KEY_ID"
            echo "APPLE_API_ISSUER=$ISSUER"
          } >> "$GITHUB_ENV"

      - name: Package + publish DMG
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ -n "${{ needs.tag.outputs.tag }}" ]; then
            # Real release (tag push, or a dispatch that bumped): publish
            # to GitHub. electron-builder reads GH_TOKEN to upload
            # artifacts to the matching Release.
            npx electron-builder --mac --publish always
          else
            # Plain dispatch (bump=none): just produce the .dmg.
            npx electron-builder --mac --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder imports this .p12 into a throwaway keychain and
          # signs with the Developer ID Application identity inside it. Both
          # empty (fork PRs) → unsigned build, no failure.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # APPLE_API_KEY / _KEY_ID / _ISSUER arrive via $GITHUB_ENV from the
          # step above.

      - name: Upload artifact (unpublished manual runs only)
        if: github.event_name == 'workflow_dispatch' && needs.tag.result == 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: PicG-mac
          path: |
            dist-electron/*.dmg
            dist-electron/latest-mac.yml
          retention-days: 14

  build-win:
    needs: [tag]
    # Same guard as build-mac: runs for tag pushes and every manual
    # dispatch; always() lets it proceed when `tag` was skipped, and a
    # failed/cancelled `tag` aborts it. Runs concurrently with build-mac
    # and publishes to the same Release (electron-builder reuses the
    # existing release rather than recreating it).
    if: |
      always() &&
      needs.tag.result != 'failure' &&
      needs.tag.result != 'cancelled'
    runs-on: windows-latest
    timeout-minutes: 45
    # fetch-dugite-native.js (curl + tar) and the publish step's
    # `if [ ... ]` are POSIX shell; force bash so they don't run under
    # PowerShell. windows-latest ships Git Bash plus curl.exe + tar.exe.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the bumped commit when the tag job cut one; otherwise
          # whatever triggered us.
          ref: ${{ needs.tag.outputs.tag || github.ref }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Fetch git + build Electron main + Next standalone
        run: |
          npm run fetch:git:all
          npm run electron:build
          npm run next:build:packaging

      - name: Generate icon
        run: node scripts/build-icon.js

      - name: Package + publish NSIS installer
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ -n "${{ needs.tag.outputs.tag }}" ]; then
            # Real release (tag push, or a dispatch that bumped): publish
            # to GitHub. electron-builder reads GH_TOKEN to upload the
            # installer + latest.yml to the matching Release.
            npx electron-builder --win --x64 --publish always
          else
            # Plain dispatch (bump=none): just produce the installer.
            npx electron-builder --win --x64 --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned for now — users get a Windows SmartScreen warning on
          # first run. Once you have a code-signing cert (an OV/EV .pfx or
          # an Azure Trusted Signing account), set:
          #   CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          #   CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}

      - name: Upload artifact (unpublished manual runs only)
        if: github.event_name == 'workflow_dispatch' && needs.tag.result == 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: PicG-win
          path: |
            dist-electron/*.exe
            dist-electron/latest.yml
          retention-days: 14
